name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify frontend and Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Validate Worker bundle
        working-directory: worker
        run: npm run build

  tribute-tests:
    name: Test Tribute webhook verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Run Tribute signature tests
        run: deno test --allow-env supabase/functions/_tests/tributeSignature.test.ts

  deploy-worker:
    name: Deploy API Worker
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [verify, tribute-tests]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Deploy Worker to Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

  deploy-frontend:
    name: Deploy WebApp to Cloudflare Pages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [verify, tribute-tests]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy to Cloudflare Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=rotationtv-web-app

  deploy-tribute-function:
    name: Deploy Tribute Supabase Function
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_SUPABASE_FUNCTIONS == 'true' }}
    needs: [verify, tribute-tests]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy webhook function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: npx --yes supabase functions deploy webhook-tribute --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
