name: Auto-Deploy Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build preview
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_PREVIEW_API_URL || 'https://rtv-api-preview.rotationtv.workers.dev' }}
          VITE_STREAM_GATEWAY_URL: ${{ vars.VITE_STREAM_GATEWAY_URL || 'https://customer-streams.cloudflarestream.com' }}

      - name: Deploy to Cloudflare Pages (Preview)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DEPLOY_OUT=$(npx wrangler pages deploy dist \
            --project-name=rotationtv-web-app \
            --branch="pr-${{ github.event.pull_request.number }}" \
            2>&1)
          echo "$DEPLOY_OUT"
          URL=$(echo "$DEPLOY_OUT" | grep -oP 'https://[^\s]+\.pages\.dev' | tail -1)
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment Preview URL
        if: steps.deploy.outputs.preview_url
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployed:** ${process.env.PREVIEW_URL}`
            });
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
