name: Deploy Control

on:
  push:
    branches: [main]
    paths:
      - 'worker/src/routes/admin.ts'
      - 'worker/src/routes/auth.ts'
      - 'worker/src/routes/payouts.ts'
      - 'worker/src/routes/payoutEngine.ts'
      - 'worker/src/routes/tips.ts'
      - 'worker/src/routes/tributeWebhook.ts'
      - 'worker/src/lib/**'
      - 'supabase/**'
      - 'd1/**'

permissions:
  contents: read
  deployments: write

jobs:
  deploy-control-plane:
    name: Deploy Control Plane
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install worker dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Deploy control plane worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

      - name: Run D1 migrations (if changed)
        if: contains(github.event.commits.*.modified, 'd1/')
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for migration in ../d1/migrations/*.sql; do
            echo "Applying: $migration"
            npx wrangler d1 execute rtv-production --file="$migration" --remote || true
          done

      - name: Deploy Tribute Supabase function
        if: contains(github.event.commits.*.modified, 'supabase/functions/webhook-tribute/')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          npx --yes supabase functions deploy webhook-tribute \
            --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

  rollback-ready:
    name: Verify Rollback Capability
    runs-on: ubuntu-latest
    needs: [deploy-control-plane]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install worker deps
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: List available rollback versions
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Available rollback versions:"
          npx wrangler deployments list 2>/dev/null || echo "  (deployment list requires wrangler auth)"
          echo ""
          echo "To rollback: npx wrangler rollback"
