name = "rtv-api"
main = "src/index.ts"
compatibility_date = "2025-03-20"

# Default (CI dry-run / wrangler dev without --env). Production IDs live under [env.production].
[stream]
binding = "STREAM"

[env.production]
name = "rtv-api"

[[env.production.d1_databases]]
binding = "DB"
database_name = "rtv-prod-db"
database_id = "4c51f100-3de8-4fc2-a355-08ae412077e9"
migrations_dir = "../d1/migrations"

# Alias used by existing route handlers that read c.env.D1.
[[env.production.d1_databases]]
binding = "D1"
database_name = "rtv-prod-db"
database_id = "4c51f100-3de8-4fc2-a355-08ae412077e9"
migrations_dir = "../d1/migrations"

[[env.production.kv_namespaces]]
binding = "KV_RATE_LIMIT"
id = "96e51e2e7a1040e58d794c5f70d74d9d"

[[env.production.kv_namespaces]]
binding = "KV_CACHE"
id = "5bcff7ee359a4422b35d800e4ebae80e"

[env.production.stream]
binding = "STREAM"

[env.production.vars]
ENVIRONMENT = "production"

# --- Secrets (do NOT put values in this file) --------------------------------
# Required runtime secrets, set them once with:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN --env production
#   npx wrangler secret put JWT_SECRET --env production
#   npx wrangler secret put ADMIN_SECRET --env production
# Optional: override the initData freshness window (seconds, default 86400):
#   npx wrangler secret put TELEGRAM_INITDATA_MAX_AGE --env production
# Stream management (create/delete live inputs + VOD):
#   npx wrangler secret put CF_STREAM_API_TOKEN --env production
#   npx wrangler secret put CF_ACCOUNT_ID --env production
# Stream customer hostname, e.g. customer-xxxx.cloudflarestream.com:
#   npx wrangler secret put CF_STREAM_CUSTOMER_SUBDOMAIN --env production
#
# GitHub Actions (repo Settings → Secrets and variables → Actions → production):
#   CLOUDFLARE_API_TOKEN    # Pages + Workers deploy token
#   CLOUDFLARE_ACCOUNT_ID   # Account that owns rtv-api / rotationtv-web-app
# Variables:
#   VITE_API_URL
#   VITE_STREAM_GATEWAY_URL  # https://rtv-ai-gateway.rotationtvaicom.workers.dev
#   VITE_DEFAULT_STREAM_UID  # optional Cloudflare Stream live-input uid

# --- Optional: KV namespace for token/session storage ------------------------
# The app works without it (session tokens are stateless HMAC tokens), but if
# you want server-side token storage/revocation via the KV_TOKENS binding:
#   1. Create the namespace:
#        npx wrangler kv namespace create KV_TOKENS --env production
#   2. Copy the printed id, then UNCOMMENT the block below and paste the id.
#      (Left commented on purpose: a placeholder id would break deploys.)
#
# [[env.production.kv_namespaces]]
# binding = "KV_TOKENS"
# id = "<paste-real-kv-tokens-namespace-id-here>"
