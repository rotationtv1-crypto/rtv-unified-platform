name = "rtv-api"
main = "src/index.ts"
compatibility_date = "2026-08-25"

[env.production]
name = "rtv-api"
routes = [{ pattern = "api.rotationtv.network", custom_domain = true }]

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "rtv-prod-db"
database_id = "4c51f100-3de8-4fc2-a355-08ae412077e9"

[[env.production.kv_namespaces]]
binding = "KV_RATE_LIMIT"
id = "96e51e2e7a1040e58d794c5f70d74d9d"

[[env.production.kv_namespaces]]
binding = "KV_CACHE"
id = "5bcff7ee359a4422b35d800e4ebae80e"

# Required runtime secrets are configured in Cloudflare, never committed:
# TELEGRAM_BOT_TOKEN
# JWT_SECRET
# ADMIN_SECRET
# Optional: TELEGRAM_INITDATA_MAX_AGE
# Optional Stream secrets: CF_STREAM_API_TOKEN, CF_ACCOUNT_ID

# Optional server-side token revocation storage:
# [[env.production.kv_namespaces]]
# binding = "KV_TOKENS"
# id = "<real-kv-tokens-namespace-id>"
